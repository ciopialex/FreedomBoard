<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Gyroscope Visualization</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #fff; overflow: hidden; font-family: monospace; color: #000; }

        #info-overlay { position: absolute; top: 20px; left: 20px; padding: 10px; background-color: rgba(255, 255, 255, 0.7); border: 1px solid #000; pointer-events: none; }

    <script type="importmap">

            "three": "https://unpkg.com/three@0.148.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.148.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info-overlay">
        <h1>REAL-TIME ORIENTATION</h1>
        <p>NXP FRDM-KL25Z</p>
        <p id="data-readout">Waiting for data...</p>
    </div>
    <canvas id="scene-container"></canvas>
    
    <script type="module" src="./visualization.js"></script>
</body>
</html>
